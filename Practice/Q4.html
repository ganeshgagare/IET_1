<!DOCTYPE html>
<html>
<head>
  <title>Student Information</title>
</head>
<body>

  <h2>Enter Student Information</h2>

  <label for="firstName">First Name:</label>
  <input type="text" id="firstName"><br><br>

  <label for="lastName">Last Name:</label>
  <input type="text" id="lastName"><br><br>

  <label for="marks">Marks:</label>
  <input type="number" id="marks"><br><br>

  <button onclick="addStudent()">Add Student</button>

  <h3>Student Details:</h3>
  <div id="studentInfo"></div>

  <script>
    // Student object
    const stud = {
      firstName: "",
      lastName: "",
      marks: 0
    };

    function addStudent() {
      // Read input values
      stud.firstName = document.getElementById('firstName').value;
      stud.lastName = document.getElementById('lastName').value;
      stud.marks = parseInt(document.getElementById('marks').value, 10);

      // Display student info on the page
      
    // document.getElementById('studentInfo').innerHTML =
    //   JSON.stringify(stud);

      
      document.getElementById('studentInfo').innerHTML =
        "First Name: " + stud.firstName + "<br>" +
        "Last Name: " + stud.lastName + "<br>" +
        "Marks: " + stud.marks;
    }
  </script>

</body>
</html>
