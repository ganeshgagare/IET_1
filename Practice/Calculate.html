<!DOCTYPE html>
<html>
<body>

<form onsubmit="return validateAndShowTable()">
  <input type="text" id="num" placeholder="Enter a number" />
  <input type="submit" value="Show Table" />
</form>

<div id="tableDiv"></div>

<script>
function validateAndShowTable() {
  const input = document.getElementById('num').value.trim();
  if (input === '') {
    alert('Please enter a number');
    return false;
  }
  const num = Number(input);
  if (isNaN(num)) {
    alert('Please enter a valid number');
    return false;
  }

  let tableHTML = '<table border="1"><tr><th>Multiplier</th><th>Result</th></tr>';
  for (let i = 1; i <= 10; i++) {
    tableHTML += '<tr><td>' + i + '</td><td>' + (num * i) + '</td></tr>';
  }
  tableHTML += '</table>';

  document.getElementById('tableDiv').innerHTML = tableHTML;
  return false;  // Prevent form submission to server
}
</script>

</body>
</html>
